<script>
'use strict';
/* Single-file, dependency-free feature lab inspired by AonzOG/open-canvas.
 * This file DOES NOT bundle or execute the repository's Next.js/LangGraph/Supabase services. */
const KEY='oc-browser-feature-lab-v3';
const EXAMPLES={
 markdown:'# Your next great idea\n\nStart writing directly in the canvas. You can **edit**, preview, save versions, and export your work.\n\n## Outline\n\n- First point\n- Second point\n\n> Select text and try a quick action, or connect a local Ollama model for AI rewrites.\n',
 html:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <style>\n    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f6ff; color: #16213a; }\n    main { max-width: 700px; margin: 12vh auto; padding: 35px; background: white; border-radius: 20px; box-shadow: 0 20px 80px #dfe6fa; }\n    h1 { font-size: 2.4rem; margin-top: 0; }\n    button { background: #235deb; border: 0; color: white; border-radius: 10px; padding: 12px 22px; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <main>\n    <p>✨ Open Canvas feature lab</p>\n    <h1>Your interactive webpage</h1>\n    <p>Change this HTML and press Run preview to test it safely.</p>\n    <button onclick="alert(\'It works!\')">Try the button</button>\n  </main>\n</body>\n</html>',
 javascript:'// Edit this JavaScript, then click Run preview.\nconst items = [1, 2, 3, 4, 5];\nconsole.log("Values:", items);\nconsole.log("Sum:", items.reduce((a, b) => a + b, 0));',
 python:'def greet(name: str) -> str:\n    return f"Hello, {name}!"\n\nif __name__ == "__main__":\n    print(greet("Open Canvas"))',
 css:'body {\n  font-family: system-ui, sans-serif;\n  background: linear-gradient(135deg, #f7faff, #e7eeff);\n  color: #17213b;\n}\n\nh1 {\n  text-align: center;\n  margin-top: 3rem;\n}'
};
const DEFAULT_ACTIONS=[
 {id:'shorten',name:'Shorten',hint:'Trim text to a smaller extract',type:'local'},
 {id:'clean',name:'Tidy Markdown',hint:'Clean excess spaces and blank lines',type:'local'},
 {id:'add-emojis',name:'Add emojis',hint:'Add visual flourishes to headings',type:'local'},
 {id:'reading-level',name:'Change reading level',hint:'Requires a connected LLM',type:'ai'},
 {id:'expand',name:'Expand',hint:'Requires a connected LLM',type:'ai'},
 {id:'translate',name:'Translate',hint:'Requires a connected LLM',type:'ai'},
 {id:'comments',name:'Add code comments',hint:'Add starter explanatory comments',type:'local'},
 {id:'logs',name:'Add logging',hint:'Insert sample debug output',type:'local'},
 {id:'fix',name:'Fix bugs',hint:'Requires a connected LLM',type:'ai'},
 {id:'port',name:'Port to another language',hint:'Requires a connected LLM',type:'ai'}
];
const now=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const icon=(name,cl='')=>`<svg class="icon ${cl}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const escapeHTML=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function newThread(){return {id:uid(),title:'New chat',date:now(),messages:[],artifact:null};}
function seed(){const a=newThread();return {threads:[a],active:a.id,theme:'light',view:'split',chatWidth:388,drawer:false,chatCollapsed:false,mobileCanvas:false,notes:[],actions:[],ollama:{base:'http://127.0.0.1:11434',model:'llama3.2'},lastModel:'demo'};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.threads)&&v.threads.length&&v.active&&v.threads.some(t=>t.id===v.active)){return {...seed(),...v,drawer:false}}}catch(e){}return seed();}
let state=load();let connection={on:false,busy:false};let sessionAbort=null;let versionTimer=null;let busy=false;let modalName=null;let inspector=false;let selectedRange=null;let previewConsole=[];let toastId=0;
const active=()=>state.threads.find(t=>t.id===state.active)||state.threads[0];
const artifact=()=>active()?.artifact||null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Browser storage is unavailable or full. Export your workspace.',true)}}
function toast(message,error=false){const box=document.getElementById('toasts');const item=document.createElement('div');item.className='toast '+(error?'error':'');item.textContent=message;box.appendChild(item);setTimeout(()=>{item.style.opacity='0';setTimeout(()=>item.remove(),180)},4300)}
function getTextStats(s){const str=String(s||'');return {words:(str.match(/\b[\w’'-]+\b/g)||[]).length,chars:str.length,lines:str.split('\n').length}}
function syncTheme(){document.documentElement.dataset.theme=state.theme;document.getElementById('app').style.setProperty('--chat-width',Math.max(290,Math.min(670,state.chatWidth||388))+'px');document.getElementById('app').classList.toggle('mobile-canvas',Boolean(state.mobileCanvas));}
function cleanMarkdown(raw){return String(raw).replace(/\r\n/g,'\n').replace(/[^\S\n]+$/gm,'').replace(/\n{4,}/g,'\n\n\n').trimEnd()+'\n'}
function inlineMD(s){let v=escapeHTML(s);v=v.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_m,lab,url)=>`<a href="${url.replaceAll('"','%22')}" target="_blank" rel="noopener noreferrer">${lab}</a>`);v=v.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');return v}
function markdown(raw){const lines=String(raw||'').replace(/\r/g,'').split('\n');let html=[],para=[],lst=null,block=false,inCode=false,code=[];const flush=()=>{if(para.length){html.push('<p>'+inlineMD(para.join(' '))+'</p>');para=[]}if(lst){html.push(`</${lst}>`);lst=null}if(block){html.push('</blockquote>');block=false}};for(let i=0;i<lines.length;i++){let line=lines[i];if(/^\s*```/.test(line)){if(!inCode){flush();inCode=true;code=[]}else{html.push('<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>');inCode=false}continue}if(inCode){code.push(line);continue}if(!line.trim()){flush();continue}const heading=line.match(/^(#{1,3})\s+(.+)/);if(heading){flush();const n=heading[1].length;html.push(`<h${n}>${inlineMD(heading[2])}</h${n}>`);continue}if(/^\s*---+\s*$/.test(line)){flush();html.push('<hr>');continue}const quote=line.match(/^>\s?(.*)/);if(quote){if(para.length||lst)flush();if(!block){html.push('<blockquote>');block=true}html.push('<p>'+inlineMD(quote[1])+'</p>');continue}if(block){flush()}const m=line.match(/^\s*([-*+]\s+|\d+\.\s+)(.*)/);if(m){if(para.length)flush();let tag=/\d/.test(m[1][0])?'ol':'ul';if(lst&&lst!==tag){html.push(`</${lst}>`);lst=null}if(!lst){html.push(`<${tag}>`);lst=tag}let item=m[2].replace(/^\[ \]\s*/,'☐ ').replace(/^\[x\]\s*/i,'☑ ');html.push('<li>'+inlineMD(item)+'</li>');continue}if(lst){flush()}para.push(line)}if(inCode)html.push('<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>');flush();return html.join('\n')}
function createArtifact(type='text',lang='markdown',name='',content){flushVersion();const t=active();const l=type==='text'?'markdown':(lang||'javascript');const body=content!==undefined?content:(type==='text'?EXAMPLES.markdown:(EXAMPLES[l]||'// Start writing code here.\n'));const a={id:uid(),title:name||(type==='text'?'Untitled document':`Untitled ${l} snippet`),type,language:l,content:body,versions:[{id:uid(),body,title:name||'Initial version',type,language:l,artifactTitle:name||(type==='text'?'Untitled document':`Untitled ${l} snippet`),at:now()}],versionIndex:0,dirty:false};t.artifact=a;if(t.title==='New chat')t.title=a.title;state.view=type==='text'?'split':'edit';state.mobileCanvas=true;persist();render();toast('Canvas created and saved locally');}
function flushVersion(){clearTimeout(versionTimer);const a=artifact();if(!a||!a.dirty)return;const current=a.versions[a.versionIndex];if(current?.body===a.content&&current?.type===a.type&&current?.language===a.language&&current?.artifactTitle===a.title){a.dirty=false;persist();return}if(a.versionIndex<a.versions.length-1){a.versions=a.versions.slice(0,a.versionIndex+1)}a.versions.push({id:uid(),body:a.content,title:'Edit',type:a.type,language:a.language,artifactTitle:a.title,at:now()});a.versionIndex=a.versions.length-1;a.dirty=false;persist();refreshHeader();}
function queueVersion(){clearTimeout(versionTimer);versionTimer=setTimeout(()=>flushVersion(),1150)}
function setContent(text,label='Edit'){const a=artifact();if(!a)return;a.content=text;a.dirty=true;if(label!=='Edit'){flushVersion();a.versions[a.versionIndex].title=label}else queueVersion();persist();refreshHeader();const preview=document.getElementById('rendered-markdown');if(preview)preview.innerHTML=text.trim()?markdown(text):'<div class="preview-empty">'+icon('file')+'<span>Preview appears as you write</span></div>';const nums=document.querySelector('.line-nums');if(nums)nums.textContent=Array.from({length:getTextStats(text).lines},(_,i)=>String(i+1)).join('\n');const counter=document.getElementById('stats-left');if(counter){const st=getTextStats(text);counter.textContent=`${st.words} words · ${st.chars} characters · ${st.lines} lines`}}
function setVersion(direction){flushVersion();const a=artifact();if(!a)return;const idx=Math.max(0,Math.min(a.versions.length-1,a.versionIndex+direction));if(idx===a.versionIndex)return;a.versionIndex=idx;a.content=a.versions[idx].body;a.type=a.versions[idx].type||a.type;a.language=a.versions[idx].language||a.language;a.title=a.versions[idx].artifactTitle||a.title;a.dirty=false;persist();render();toast(`Viewing version ${idx+1} of ${a.versions.length}`)}
function addChat(role,text,meta){active().messages.push({id:uid(),role,text,at:now(),meta:meta||''});persist()}
function goThread(id){flushVersion();if(!state.threads.some(t=>t.id===id))return;state.active=id;state.drawer=false;state.view='split';state.mobileCanvas=!!active().artifact;persist();render()}
function createThread(){flushVersion();const t=newThread();state.threads.unshift(t);state.active=t.id;state.drawer=false;state.mobileCanvas=false;persist();render()}
function deleteThread(id){if(!confirm('Delete this local conversation and its artifact? This cannot be undone.'))return;state.threads=state.threads.filter(t=>t.id!==id);if(!state.threads.length)state.threads=[newThread()];if(state.active===id)state.active=state.threads[0].id;persist();render()}
function modelLabel(){return connection.on?`Ollama · ${state.ollama.model}`:'Offline demo'}
function renderChat(){const t=active(),m=t.messages,history=m.length?m.map(msg=>`<article class="message ${msg.role==='user'?'user':''}"><div class="avatar">${msg.role==='user'?'YOU':'OC'}</div><div class="bubble ${msg.role==='user'?'user-bubble':''}">${msg.role==='assistant'?'<div class="sender">Open Canvas '+(msg.meta?'<span class="muted">· '+escapeHTML(msg.meta)+'</span>':'')+'</div>':''}<p>${escapeHTML(msg.text)}</p></div></article>`).join(''):`<div class="welcome"><div class="welcome-mark">${icon('canvas','lg')}</div><h1>What would you like to write today?</h1><p>Explore the Open Canvas workflow in this offline, browser-only feature lab.</p><div class="start-grid"><button class="start-card" data-action="new-markdown">${icon('file','lg')}<strong>New Markdown</strong><small>Write and preview</small></button><button class="start-card" data-action="new-code">${icon('code','lg')}<strong>New code</strong><small>Edit and run HTML / JS</small></button></div><div class="prompt-caption">START WITH A MESSAGE</div><button class="prompt-card" data-prompt="Draft a short project proposal">Draft a short project proposal</button><button class="prompt-card" data-prompt="Create a simple HTML landing page">Create a simple HTML landing page</button><button class="prompt-card" data-prompt="Write JavaScript to calculate a sum">Write JavaScript to calculate a sum</button></div>`;return `<div class="pane-header chat-header"><div>${icon('canvas','lg')}</div><div><div class="header-title">Open Canvas</div><div class="header-sub">Browser Feature Lab · not the repository runtime</div></div><div class="spacer"></div><button class="icon-btn" title="New chat" data-action="new-thread">${icon('plus')}</button><button class="icon-btn" title="Browse chats" data-action="history">${icon('history')}</button><button class="icon-btn hide-mobile" title="Collapse chat" data-action="collapse-chat">${icon('panel')}</button></div><div class="chat-scroll" id="chat-scroll">${history}</div><div class="chat-composer"><div class="composer-box"><textarea id="chat-input" aria-label="Message" placeholder="Ask for a draft, code or an edit…" rows="2"></textarea><div class="composer-actions"><button class="icon-btn" title="Import text/code file" data-action="import">${icon('upload')}</button><button class="model-button" data-action="settings">${icon(connection.on?'check':'terminal','sm')} ${escapeHTML(modelLabel())} ${icon('settings','sm')}</button><div class="spacer"></div>${busy?'<span class="muted" style="font-size:11px">Working…</span>':''}<button class="send-btn" data-action="send" aria-label="Send message" title="Send message">${icon('send')}</button></div></div><div class="composer-foot"><span>${connection.on?'Messages are sent to your Ollama server':'Local deterministic demo · no external AI calls'}</span><span><span class="kbd">Enter</span> send</span></div></div>`}
function renderHistory(){const out=document.getElementById('history-drawer');out.hidden=!state.drawer;if(!state.drawer)return;out.innerHTML=`<div class="drawer-header"><h2>Chat history</h2><button class="icon-btn" data-action="history">${icon('x')}</button></div><div class="drawer-search"><input id="history-filter" placeholder="Search conversations" aria-label="Search conversations"></div><div class="thread-list" id="thread-list">${state.threads.map(t=>`<div class="thread-item ${t.id===state.active?'active':''}" data-title="${escapeHTML(t.title.toLowerCase())}"><button class="thread-main" data-thread="${escapeHTML(t.id)}">${icon('file','sm')}<span>${escapeHTML(t.title)}</span></button><button class="thread-remove" aria-label="Delete conversation" title="Delete conversation" data-delete="${escapeHTML(t.id)}">${icon('trash','sm')}</button></div>`).join('')}</div><div style="padding:14px;border-top:1px solid var(--line)"><button class="btn" style="width:100%" data-action="new-thread">${icon('plus','sm')} New conversation</button></div>`}
function previewBox(a){if(a.type==='text')return `<div class="preview md" id="rendered-markdown">${a.content.trim()?markdown(a.content):'<div class="preview-empty">'+icon('file')+'<span>Preview appears as you write</span></div>'}</div>`;if(['html','javascript','css','svg'].includes(a.language))return `<div class="code-preview"><iframe id="code-frame" title="Isolated code preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><div class="console" id="preview-console"></div></div>`;return `<div class="preview"><div class="preview-empty">${icon('terminal','lg')}<strong>Native runtime required</strong><span>Only HTML, CSS, SVG and JavaScript can run inside this browser sandbox.<br>${escapeHTML(a.language.toUpperCase())} still supports editing, revisions and export.</span></div></div>`}
function renderCanvas(){const a=artifact();const root=document.getElementById('canvas-panel');if(!a){root.innerHTML=`<div class="pane-header canvas-header"><div class="header-title">Canvas</div><div class="spacer"></div><span class="tag">Ready</span><button class="icon-btn" data-action="help" title="About the lab">${icon('info')}</button></div><div class="canvas-body"><div class="canvas-empty"><div class="hero-icon">${icon('file','lg')}</div><h2>Make something worth keeping.</h2><p>Start a Markdown document, write code, or ask the chat for a starter artifact. Changes and versions are stored in your browser.</p><div style="display:flex;justify-content:center;gap:8px;margin-top:20px"><button class="btn primary" data-action="new-markdown">${icon('plus','sm')} New document</button><button class="btn" data-action="new-code">${icon('code','sm')} New code</button></div></div></div><div class="canvas-foot"><span>Open Canvas Browser Feature Lab</span><span>Standalone · no setup</span></div>`;return}
const m=state.view||'split';const v=a.versions.length;const tStats=getTextStats(a.content);const code=a.type==='code';const previewPossible=!code||['html','javascript','css','svg'].includes(a.language);root.innerHTML=`<div class="pane-header canvas-header"><button class="icon-btn hide-mobile ${state.chatCollapsed?'':'hide'}" data-action="collapse-chat" title="Show chat">${icon('panel')}</button><button class="icon-btn mobile-only" data-action="mobile-chat" title="Show chat on small screens">${icon('chevron-left')}</button><div class="doc-heading"><input class="doc-title" id="doc-title" aria-label="Artifact title" value="${escapeHTML(a.title)}" title="Rename artifact"><span class="save-label" id="save-label">${a.dirty?'Saving…':'Saved locally'}</span></div><div class="version-control"><button class="icon-btn" title="Previous version" data-action="prev-version" ${a.versionIndex===0?'disabled':''}>${icon('chevron-left','sm')}</button><span id="version-count">${a.versionIndex+1} / ${v}</span><button class="icon-btn" title="Next version" data-action="next-version" ${a.versionIndex===v-1?'disabled':''}>${icon('chevron-right','sm')}</button></div><div class="header-divider hide-mobile"></div><button class="icon-btn" data-action="versions" title="All versions">${icon('history')}</button><button class="icon-btn hide-mobile" data-action="memories" title="Memory">${icon('brain')}</button><button class="icon-btn" data-action="export" title="Export current artifact">${icon('download')}</button><button class="icon-btn" data-action="inspector" title="More options">${icon('ellipsis')}</button></div>
<div class="canvas-body"><div class="toolbar"><div class="tab-toggle" role="group" aria-label="Artifact type"><button data-action="type-text" class="${!code?'selected':''}" title="Markdown document">${icon('file','sm')} Text</button><button data-action="type-code" class="${code?'selected':''}" title="Source code">${icon('code','sm')} Code</button></div>${code?`<select class="select" id="language" aria-label="Code language">${['html','javascript','css','python','typescript','json','sql','java','cpp','rust','php','xml','svg','plaintext'].map(l=>`<option value="${l}" ${a.language===l?'selected':''}>${l==='javascript'?'JavaScript':l==='typescript'?'TypeScript':l.toUpperCase()}</option>`).join('')}</select>`:''}<div class="spacer"></div><div class="tab-toggle" role="group" aria-label="Editor display"><button class="${m==='edit'?'selected':''}" data-view="edit">Edit</button><button class="${m==='split'?'selected':''}" data-view="split">Split</button><button class="${m==='preview'?'selected':''}" data-view="preview">Preview</button></div><button class="btn tiny" data-action="quick" title="Quick actions">${icon('wand','sm')} <span class="hide-small">Quick actions</span></button>${code&&previewPossible?`<button class="btn tiny" data-action="run" title="Run isolated code preview">${icon('play','sm')} Run</button>`:''}</div>
<div class="editor-stage"><div class="editor-shell"><div class="editor-topline"><span>${code?icon('code','sm'):icon('file','sm')}</span><strong>${escapeHTML(code?a.language.toUpperCase():'MARKDOWN')}</strong><div class="spacer"></div><span class="selection-tag hide" id="selection-status">Selection</span><button class="icon-btn" title="Copy artifact" data-action="copy">${icon('copy','sm')}</button><button class="icon-btn" title="Save a version now" data-action="save-version">${icon('check','sm')}</button></div><div class="editor-content ${m==='split'?'split':''}"><div class="code-editor-area ${m==='preview'?'hide':''}">${code?`<div class="line-nums" id="gutter">${Array.from({length:tStats.lines},(_,i)=>i+1).join('\n')}</div>`:''}<textarea class="source-editor ${!code?'markdown-editor':''}" id="artifact-input" spellcheck="${!code}" aria-label="${code?'Code':'Markdown'} editor">${escapeHTML(a.content)}</textarea></div>${m==='edit'?'':previewBox(a)}</div></div></div></div>
<div class="canvas-foot"><span id="stats-left">${tStats.words} words · ${tStats.chars} characters · ${tStats.lines} lines</span><div class="foot-stack"><span>Version ${a.versionIndex+1}</span><span>${code?escapeHTML(a.language):'Markdown'}</span><span>Local</span></div></div>`;if(code&&m!=='edit')requestAnimationFrame(()=>runPreview(false));}
function refreshHeader(){const a=artifact();if(!a)return;const ct=document.getElementById('version-count'),sl=document.getElementById('save-label');if(ct)ct.textContent=`${a.versionIndex+1} / ${a.versions.length}`;if(sl)sl.textContent=a.dirty?'Saving…':'Saved locally';const vf=document.querySelector('.canvas-foot .foot-stack span');if(vf)vf.textContent='Version '+(a.versionIndex+1);const b1=document.querySelector('[data-action="prev-version"]'),b2=document.querySelector('[data-action="next-version"]');if(b1)b1.disabled=a.versionIndex===0;if(b2)b2.disabled=a.versionIndex===a.versions.length-1;}

function renameArtifact(title){const a=artifact();if(!a)return;title=title.trim().slice(0,150)||'Untitled artifact';if(title===a.title)return;a.title=title;a.dirty=true;flushVersion();persist();}
function useLang(lang){flushVersion();const a=artifact();if(!a)return;a.type='code';a.language=lang;a.dirty=true;flushVersion();state.view='edit';persist();render()}
function startCode(){const lang=prompt('Choose a programming language (html, javascript, python, css, json, sql, etc.)','html');if(lang===null)return;const clean=lang.toLowerCase().trim()||'html';createArtifact('code',clean)}
function transformLocal(id,text,a){let out=text;switch(id){case 'clean':return cleanMarkdown(text);case 'shorten':{const chunks=text.split(/(?<=[.!?])\s+|\n+/).filter(x=>x.trim());return chunks.length>1?chunks.slice(0,Math.max(1,Math.ceil(chunks.length*.55))).join('\n'):text.split(/\s+/).slice(0,Math.max(10,Math.ceil(text.trim().split(/\s+/).length*.58))).join(' ')}case 'add-emojis':return text.replace(/^#\s+(.+)$/gm,'# ✨ $1').replace(/^##\s+(.+)$/gm,'## 🔹 $1');case 'comments':{const lang=a?.language||'javascript';const mark=['html','xml','svg'].includes(lang)?'<!-- ':['python','sh'].includes(lang)?'# ':'// ';const end=mark==='<!-- '?' -->':'';const lines=text.split('\n');if(!lines.length)return text;let ret=[];let n=0;for(const line of lines){if(line.trim()&&!line.trim().startsWith(mark.trim())&&n++%4===0)ret.push(`${mark}Review this section${end}`);ret.push(line)}return ret.join('\n')}case 'logs':{const lang=a?.language||'javascript';if(lang==='python')return text+'\n\nprint("Debug checkpoint reached")';if(lang==='html')return text.replace('</body>','<script>console.log("Debug checkpoint reached")<\/script>\n</body>');return text+'\n\nconsole.log("Debug checkpoint reached");'}default:return null}}
function templateFromPrompt(p){const txt=p.toLowerCase();const topic=p.replace(/^(please\s+)?(create|write|draft|build|make|generate)\s+(me\s+)?(a\s+|an\s+)?/i,'').replace(/[.?!]$/,'').trim().slice(0,95)||'New idea';if(/(html|webpage|website|landing page|button|web app)/.test(txt)){return {title:'Webpage starter',type:'code',language:'html',content:EXAMPLES.html}}if(/(javascript|typescript|script|function|python|java|code|sql|fibonacci|calculator)/.test(txt)){const lang=txt.includes('python')?'python':txt.includes('sql')?'sql':'javascript';let code=lang==='python'?EXAMPLES.python:lang==='sql'?'-- SQL starter\nSELECT id, name\nFROM items\nORDER BY name;':EXAMPLES.javascript;return {title:topic.replace(/\b\w/g,c=>c.toUpperCase()).slice(0,60),type:'code',language:lang,content:code}}const title=topic.charAt(0).toUpperCase()+topic.slice(1);const content=`# ${title}\n\n> This is a **local starter outline**, not an AI-generated factual article. Edit the sections below or connect Ollama for generation.\n\n## Overview\n\nWrite the purpose, audience, and main idea.\n\n## Key points\n\n- Add your first key point.\n- Add supporting evidence or examples.\n- Describe the next step.\n\n## Next steps\n\nSummarise what you want the reader to do next.\n`;return {title,type:'text',language:'markdown',content}}
function isDraftRequest(s){return /\b(write|draft|create|make|build|generate|compose|script|design)\b/i.test(s)}
function messageDemo(msg){const low=msg.toLowerCase();if(/^remember\s+/i.test(msg)){const note=msg.replace(/^remember\s+/i,'').trim();if(note){state.notes.unshift({id:uid(),text:note,at:now()});addChat('assistant','Added that note to this browser demo’s local memory.','offline demo');persist();return} }if(/\b(shorten|summaris[ez]|clean up|tidy)\b/.test(low)&&artifact()){const a=artifact();const op=low.includes('shorten')||low.includes('summari')?'shorten':'clean';const result=transformLocal(op,a.content,a);if(result!==a.content){setContent(result,op==='shorten'?'Local shortening':'Local Markdown cleanup');addChat('assistant','I applied a deterministic local edit and saved a new version. This was not an LLM rewrite.','offline demo');render()}else addChat('assistant','No change was needed.','offline demo');return}if(isDraftRequest(msg)){const created=templateFromPrompt(msg);createArtifact(created.type,created.language,created.title,created.content);addChat('assistant',`I opened a ${created.type==='code'?created.language+' code':'Markdown'} starter in the canvas. It is an editable offline template, not a generated AI response. Connect Ollama in Settings to test genuine model generation.`, 'offline demo');return}addChat('assistant','This is the offline feature lab. I can create Markdown and code starters, edit documents, keep versions, store local memory notes and test code preview. For genuine AI replies and rewrites, connect a running local Ollama model in Settings, or launch the full Open Canvas repository.','offline demo')}
async function ollamaChat(messages,system){const base=state.ollama.base.replace(/\/$/,'');if(sessionAbort)sessionAbort.abort();sessionAbort=new AbortController();const timeout=setTimeout(()=>sessionAbort.abort(),90000);try{const r=await fetch(base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:sessionAbort.signal,body:JSON.stringify({model:state.ollama.model,stream:false,options:{temperature:.5},messages:[{role:'system',content:system},...messages]})});if(!r.ok)throw Error('Ollama HTTP '+r.status+': '+(await r.text()).slice(0,200));const data=await r.json();return String(data.message?.content||'')}finally{clearTimeout(timeout);sessionAbort=null}}
function extractStructured(raw){let cleaned=String(raw).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');try{return JSON.parse(cleaned)}catch(e){let s=cleaned.indexOf('{'),e2=cleaned.lastIndexOf('}');if(s>=0&&e2>s){try{return JSON.parse(cleaned.slice(s,e2+1))}catch(x){}}return null}}
async function send(){const input=document.getElementById('chat-input');if(!input||busy)return;const value=input.value.trim();if(!value)return;const history=active().messages.slice(-12).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));addChat('user',value);if(active().title==='New chat')active().title=value.slice(0,56);input.value='';if(!connection.on){messageDemo(value);persist();render();return}busy=true;render();try{const a=artifact();const system=`You are an assistant in a document/code collaboration UI. Return ONLY one JSON object with fields "message" (a friendly short description) and "artifact" (null or object with "title", "type" = "text" or "code", "language" = "markdown" or a programming language, and "content" as full contents). If user asks to generate or edit a document or code, return complete revised artifact in artifact. If user asks general question, return null. Preserve user content when editing. Never fake web search results.\nCurrent canvas: ${JSON.stringify(a?{title:a.title,type:a.type,language:a.language,content:a.content.slice(0,25000)}:null)}\nMemory notes: ${JSON.stringify(state.notes.map(n=>n.text).slice(0,25))}.`;const raw=await ollamaChat([...history,{role:'user',content:value}],system);const result=extractStructured(raw);if(result&&typeof result.message==='string'){addChat('assistant',result.message,'local Ollama');if(result.artifact&&typeof result.artifact.content==='string'){let art=result.artifact;if(a){if(typeof art.title==='string')a.title=art.title.slice(0,150);a.type=art.type==='code'?'code':'text';a.language=art.language||'markdown';setContent(art.content,'Ollama rewrite');state.view='split'}else createArtifact(art.type==='code'?'code':'text',art.language||'markdown',String(art.title||'Generated artifact').slice(0,100),art.content)}}else{addChat('assistant',raw||'The model returned an empty response.','local Ollama')}persist()}catch(e){addChat('assistant',`Local model request failed: ${e.message}. Check that Ollama is running and that its allowed origins include this browser page.`, 'connection error');toast('Ollama request failed — see chat',true)}finally{busy=false;render()}}
async function quickAction(id){const a=artifact();if(!a){toast('Open a document or code canvas first',true);return}const ref=DEFAULT_ACTIONS.find(x=>x.id===id)||state.actions.find(x=>x.id===id);if(!ref)return;if(a.type==='text'&&['comments','logs','fix','port'].includes(id)){toast('This action is for code artifacts',true);return}if(a.type==='code'&&['shorten','clean','add-emojis','reading-level','expand','translate'].includes(id)){toast('This action is for Markdown artifacts',true);return}const editor=document.getElementById('artifact-input');let start=editor?.selectionStart??0,end=editor?.selectionEnd??0;let hasSelection=start!==end;const target=hasSelection?a.content.slice(start,end):a.content;let out=transformLocal(id,target,a);if(out!==null){if(out===target){toast('No local changes needed');return}setContent(hasSelection?a.content.slice(0,start)+out+a.content.slice(end):out,'Quick action: '+ref.name);render();toast(`${ref.name} applied · new version saved`);return}if(!connection.on){toast(`“${ref.name}” needs a local AI model. Connect Ollama in Settings.`,true);return}const language=id==='translate'?prompt('Translate to which language?','French'):id==='port'?prompt('Convert to which programming language?','Python'):id==='reading-level'?prompt('Target reading level?','Simple, clear English'):null;if(language===null)return;const promptText=ref.type==='custom'?ref.prompt:`${ref.name}${language?' to '+language:''}`;busy=true;toast('Sending current artifact to your connected Ollama model…');try{const output=await ollamaChat([{role:'user',content:`Apply this editing instruction to the following ${a.language} content. Return ONLY the transformed content, without any wrapper or commentary.\nInstruction: ${promptText}\n\nCONTENT:\n${target}`}],'You are an exact document/code editing assistant. Return only edited content. Preserve unrelated meaning and code behavior.');let text=output.replace(/^```(?:[\w+-]+)?\n/,'').replace(/\n```\s*$/,'');setContent(hasSelection?a.content.slice(0,start)+text+a.content.slice(end):text,'Ollama: '+ref.name);addChat('assistant',`Applied “${ref.name}” with local Ollama and saved a new version.`,'local Ollama');toast('AI edit saved')}catch(e){toast('Action failed: '+e.message,true)}finally{busy=false;render()}}
function runPreview(show=true){const a=artifact();const frame=document.getElementById('code-frame');if(!a||!frame)return;previewConsole=[];const output=document.getElementById('preview-console');if(output)output.textContent='';if(a.language==='html'||a.language==='svg'){frame.srcdoc=a.content; if(show)toast('HTML preview refreshed in an isolated iframe');return}if(a.language==='css'){frame.srcdoc=`<!doctype html><html><body><style>${a.content.replace(/<\/style/gi,'<\\/style')}</style><main><h1>CSS Preview</h1><p>Typography, spacing, backgrounds and colours in context.</p><button>Example button</button><ul><li>List item one</li><li>List item two</li></ul></main></body></html>`;if(show)toast('CSS preview refreshed');return}if(a.language==='javascript'){const script=JSON.stringify(a.content).replace(/</g,'\\u003c');frame.srcdoc=`<!doctype html><html><head><style>body{font:13px system-ui;padding:18px;color:#263148;background:#fff}p{color:#687588}</style></head><body><h3>JavaScript runner</h3><p>Output is shown in the console below. The code runs in an isolated browser iframe.</p><script>(function(){const send=(level,args)=>parent.postMessage({source:'open-canvas-demo-frame',level,text:args.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}}).join(' ')},'*');for(const level of ['log','error','warn','info'])console[level]=(...args)=>send(level,args);window.onerror=(m)=>{send('error',[m])};try{new Function(${script})()}catch(err){send('error',[err.message])}})();<\/script></body></html>`;if(show)toast('JavaScript executed in isolated preview')}}
function download(name,body,mime='text/plain;charset=utf-8'){const blob=new Blob([body],{type:mime});const url=URL.createObjectURL(blob);const el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

async function importArtifact(file){if(!file)return;if(file.size>2e6){toast('Maximum artifact file size is 2 MB',true);return}const content=await file.text();const name=file.name.replace(/\.[^.]+$/,'');const ext=(file.name.split('.').pop()||'txt').toLowerCase();const langMap={md:'markdown',markdown:'markdown',htm:'html',html:'html',js:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',py:'python',txt:'plaintext',sql:'sql',json:'json',cpp:'cpp',css:'css',svg:'svg',xml:'xml',php:'php',rs:'rust',java:'java'};const lang=langMap[ext]||'plaintext';createArtifact(lang==='markdown'||lang==='plaintext'?'text':'code',lang,name,content);toast(`Imported ${file.name} (${content.length} characters)`)}
async function importWorkspace(file){if(!file)return;if(file.size>5e6){toast('Maximum workspace size is 5 MB',true);return}let obj;try{obj=JSON.parse(await file.text())}catch(e){toast('Not a valid JSON file',true);return}if(obj?.format!=='open-canvas-feature-lab'||!obj.data||!Array.isArray(obj.data.threads)||!obj.data.threads.length||obj.data.threads.length>1000||!obj.data.threads.every(t=>typeof t.id==='string'&&typeof t.title==='string'&&Array.isArray(t.messages)&&(!t.artifact||(typeof t.artifact.content==='string'&&Array.isArray(t.artifact.versions)&&t.artifact.versions.length>0&&Number.isInteger(t.artifact.versionIndex)&&t.artifact.versionIndex>=0&&t.artifact.versionIndex<t.artifact.versions.length)))){toast('This is not a valid feature-lab workspace export',true);return}if(!confirm('Replace the current browser workspace with the imported one? Export a backup first if needed.'))return;const old=state;state={...seed(),...obj.data,drawer:false};if(!state.threads.some(t=>t.id===state.active))state.active=state.threads[0].id;try{persist();render();toast('Workspace imported successfully')}catch(e){state=old;render();toast('Could not import workspace',true)}}

default:out=modalHead('Open Canvas','Settings');}

function openInspector(){inspector=!inspector;document.querySelector('#inspector-panel')?.remove();if(!inspector)return;const a=artifact();const el=document.createElement('aside');el.className='inspector';el.id='inspector-panel';el.innerHTML=`<div class="inspector-head"><h3>Workspace tools</h3><button class="icon-btn" data-action="inspector">${icon('x','sm')}</button></div><p>Local workspace actions and full-app links.</p>${[['quick','Quick actions'],['versions','Version history'],['export','Import and export'],['checks','Run browser self-checks'],['help','What is included?'],['settings','Connect to Ollama']].map(v=>`<div class="panel-row"><button data-action="${v[0]}">${v[1]}</button>${icon('chevron-right','sm')}</div>`).join('')}<div class="panel-row"><button data-action="clear-artifact" style="color:var(--red)">Close current artifact</button>${icon('trash','sm')}</div>`;document.body.appendChild(el)}
async function connectOllama(){const base=document.getElementById('ollama-url')?.value.trim().replace(/\/$/,'');const model=document.getElementById('ollama-model')?.value.trim();if(!/^https?:\/\//.test(base)||!model){toast('Enter a valid http(s) URL and model name',true);return}if(!confirm(`Connect to ${base}? When connected, messages and artifact content may be sent to this server.`))return;const prev={...state.ollama};const btn=document.querySelector('[data-action="connect-ollama"]');if(btn){btn.disabled=true;btn.textContent='Checking server…'}try{const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),7000);let res;try{res=await fetch(base+'/api/tags',{signal:ctrl.signal})}finally{clearTimeout(tm)}if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const names=(data.models||[]).map(m=>m.name);if(!names.some(n=>n===model||n.startsWith(model+':')||model.startsWith(n.split(':')[0]+':'))){if(!confirm(`Server is reachable, but model “${model}” is not listed (${names.join(', ')||'none'}). Connect anyway?`))return}state.ollama={base,model};connection.on=true;persist();toast('Ollama connected · real local model mode');closeModal();render()}catch(e){state.ollama=prev;connection.on=false;toast('Could not reach Ollama: '+e.message,true);renderModal()}}
function runChecks(){const tests=[];function test(name,fn,detail){try{let ok=!!fn();tests.push({name,ok,detail:detail|| (ok?'Passed':'Failed')})}catch(e){tests.push({name,ok:false,detail:String(e.message)})}}test('Markdown heading and escaping',()=>markdown('# Title\n\n<script>alert(1)<\/script>').includes('<h1>Title</h1>')&&!markdown('<script>').includes('<script>'));test('Local shorten transform',()=>transformLocal('shorten','First sentence. Second sentence. Third sentence.',null).length<40);test('Sample HTML available',()=>EXAMPLES.html.includes('<html')&&EXAMPLES.html.includes('<button'));test('Artifact file mapping',()=>extension({type:'code',language:'javascript'})==='js'&&extension({type:'text'})==='md');test('Workspace thread integrity',()=>state.threads.length>0&&state.threads.some(t=>t.id===state.active));test('Version snapshot integrity',()=>!artifact()||artifact().versions[artifact().versionIndex]?.body===artifact().content||artifact().dirty);test('Storage available',()=>{const k='oc-test-write';localStorage.setItem(k,'ok');const ok=localStorage.getItem(k)==='ok';localStorage.removeItem(k);return ok});return tests}
function clickHandler(e){const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.thread){goThread(btn.dataset.thread);return}if(btn.dataset.delete){deleteThread(btn.dataset.delete);return}if(btn.dataset.quick){const id=btn.dataset.quick;closeModal();quickAction(id);return}if(btn.dataset.version!==undefined){const a=artifact();if(a){a.versionIndex=Number(btn.dataset.version);a.content=a.versions[a.versionIndex].body;a.type=a.versions[a.versionIndex].type||a.type;a.language=a.versions[a.versionIndex].language||a.language;a.title=a.versions[a.versionIndex].artifactTitle||a.title;a.dirty=false;persist();closeModal();render()}return}if(btn.dataset.removeNote){state.notes=state.notes.filter(n=>n.id!==btn.dataset.removeNote);persist();renderModal();return}if(btn.dataset.removeAction){state.actions=state.actions.filter(n=>n.id!==btn.dataset.removeAction);persist();renderModal();return}if(btn.dataset.prompt){const input=document.getElementById('chat-input');if(input){input.value=btn.dataset.prompt;send()}return}if(btn.dataset.view){flushVersion();state.view=btn.dataset.view;persist();renderCanvas();return}switch(btn.dataset.action){case 'new-thread':createThread();break;case 'history':state.drawer=!state.drawer;renderHistory();break;case 'theme':state.theme=state.theme==='light'?'dark':'light';persist();render();break;case 'new-markdown':createArtifact('text');break;case 'new-code':startCode();break;case 'mobile-chat':state.mobileCanvas=false;render();break;case 'collapse-chat':state.chatCollapsed=!state.chatCollapsed;persist();render();break;case 'send':send();break;case 'prev-version':setVersion(-1);break;case 'next-version':setVersion(1);break;case 'save-version':flushVersion();toast('Current draft saved');break;case 'type-text':{const a=artifact();if(a){flushVersion();a.type='text';a.language='markdown';a.dirty=true;flushVersion();state.view='split';persist();render()}break}case 'type-code':{const a=artifact();if(a){flushVersion();a.type='code';a.language=a.language==='markdown'?'javascript':a.language;a.dirty=true;flushVersion();state.view='edit';persist();render()}break}case 'memories':openModal('memories');break;case 'actions':openModal('actions');break;case 'quick':openModal('quick');break;case 'settings':openModal('settings');break;case 'help':openModal('help');break;case 'versions':openModal('versions');break;case 'export':openModal('export');break;case 'checks':openModal('checks');break;case 'close-modal':closeModal();break;case 'export-artifact':exportArtifact();break;case 'export-workspace':exportWorkspace();break;case 'import':document.getElementById('import-file').click();break;case 'import-workspace':document.getElementById('workspace-file').click();break;case 'copy':{const a=artifact();if(a&&navigator.clipboard?.writeText)navigator.clipboard.writeText(a.content).then(()=>toast('Copied artifact')).catch(()=>toast('Clipboard permissions denied',true));else toast('Clipboard unavailable in this browser',true);break}case 'inspector':openInspector();break;case 'run':runPreview();break;case 'connect-ollama':connectOllama();break;case 'disconnect-ollama':connection.on=false;persist();render();renderModal();toast('Disconnected from local Ollama');break;case 'open-repo':window.open('https://github.com/AonzOG/open-canvas','_blank','noopener,noreferrer');break;case 'open-live':window.open('http://localhost:3000','_blank','noopener,noreferrer');break;case 'add-note':{const field=document.getElementById('new-note');const text=field?.value.trim();if(!text){toast('Enter a memory note',true);return}state.notes.unshift({id:uid(),text:text.slice(0,1200),at:now()});persist();renderModal();toast('Local memory added');break}case 'add-action':{const name=document.getElementById('action-name')?.value.trim();const promptText=document.getElementById('action-prompt')?.value.trim();if(!name||!promptText){toast('Name and instruction are required',true);return}state.actions.unshift({id:uid(),name:name.slice(0,60),prompt:promptText.slice(0,3000),type:'custom'});persist();renderModal();toast('Custom action saved');break}case 'clear-artifact':if(confirm('Close the current artifact and remove it from this chat? Export it first if you need a copy.')){active().artifact=null;persist();render();inspector=false;document.getElementById('inspector-panel')?.remove()}break;}}
document.addEventListener('click',clickHandler);
document.addEventListener('input',e=>{if(e.target.id==='artifact-input'){setContent(e.target.value);const selected=document.getElementById('selection-status');if(selected)selected.classList.add('hide')}if(e.target.id==='history-filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('.thread-item').forEach(x=>x.hidden=!x.dataset.title.includes(q))}});
document.addEventListener('change',e=>{if(e.target.id==='doc-title')renameArtifact(e.target.value);if(e.target.id==='language')useLang(e.target.value)});
document.addEventListener('keyup',e=>{if(e.target.id==='artifact-input')selectionStatus(e.target)});
document.addEventListener('mouseup',e=>{if(e.target.id==='artifact-input')selectionStatus(e.target)});
function selectionStatus(target){const s=document.getElementById('selection-status');if(!s)return;let n=Math.max(0,target.selectionEnd-target.selectionStart);s.textContent=n+' characters selected';s.classList.toggle('hide',!n)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalName)closeModal();if(inspector){inspector=false;document.getElementById('inspector-panel')?.remove()}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();flushVersion();toast('Version saved locally')}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();send()}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();send()}if(e.target.id==='artifact-input'&&e.key==='Tab'){e.preventDefault();const t=e.target,start=t.selectionStart,end=t.selectionEnd;t.value=t.value.slice(0,start)+'  '+t.value.slice(end);t.selectionStart=t.selectionEnd=start+2;setContent(t.value)}});
document.getElementById('modal-wrap').addEventListener('mousedown',e=>{if(e.target.id==='modal-wrap')closeModal()});
document.getElementById('import-file').addEventListener('change',async e=>{if(e.target.files?.[0]){try{await importArtifact(e.target.files[0]);closeModal()}catch(err){toast('Import failed: '+err.message,true)}}e.target.value=''});
document.getElementById('workspace-file').addEventListener('change',async e=>{if(e.target.files?.[0]){await importWorkspace(e.target.files[0]);closeModal()}e.target.value=''});
window.addEventListener('message',e=>{if(e.source!==document.getElementById('code-frame')?.contentWindow||e.data?.source!=='open-canvas-demo-frame')return;previewConsole.push(`[${e.data.level}] ${e.data.text}`);const box=document.getElementById('preview-console');if(box)box.textContent=previewConsole.slice(-40).join('\n')});
const resizer=document.getElementById('resizer');let dragging=false;resizer.addEventListener('pointerdown',e=>{dragging=true;resizer.setPointerCapture(e.pointerId);resizer.classList.add('dragging')});resizer.addEventListener('pointermove',e=>{if(!dragging)return;const width=Math.min(670,Math.max(290,e.clientX-62));state.chatWidth=width;syncTheme()});resizer.addEventListener('pointerup',()=>{dragging=false;resizer.classList.remove('dragging');persist()});
const mask=document.createElement('div');mask.className='drop-mask';mask.textContent='Drop a text / source file to open in Canvas';mask.hidden=true;document.getElementById('app').appendChild(mask);let dragDepth=0;window.addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){dragDepth++;mask.hidden=false}});window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)mask.hidden=true});window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});window.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;mask.hidden=true;const file=e.dataTransfer?.files?.[0];if(file){try{await importArtifact(file)}catch(err){toast('Could not open file: '+err.message,true)}}});
window.addEventListener('beforeunload',()=>{flushVersion()});
render();
</script>
